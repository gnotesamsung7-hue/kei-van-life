plugins { id 'com.android.application' }

android {
    namespace 'com.markdave.keivanlife'
    compileSdk 34

    defaultConfig {
        applicationId 'com.markdave.keivanlife'
        minSdk 23
        targetSdk 34
        versionCode((project.findProperty('vCode') ?: '1') as int)
        versionName "3.0." + (project.findProperty('vCode') ?: '1')
    }

    // One fixed key kept in the repo, so every build can install over the last one.
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/keivanlife.jks')
            storePassword 'keivanlife'
            keyAlias 'keivanlife'
            keyPassword 'keivanlife'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
