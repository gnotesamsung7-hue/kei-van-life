name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the game page inside the app
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon -PvCode=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KeiVanLife.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KeiVanLife
          path: KeiVanLife.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kei Van Life build ${{ github.run_number }}
          files: KeiVanLife.apk
          make_latest: true
